services:
  - type: web
    name: excalidraw-complete
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: EXCALIDRAW_DISABLE_BACKEND
        value: "false"
      - key: STORAGE_TYPE
        value: filesystem
      - key: LOCAL_STORAGE_PATH
        value: /tmp/data
